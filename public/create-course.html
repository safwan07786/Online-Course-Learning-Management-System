<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Course - Antigravity LMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar" id="mainNav"></header>

    <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
        <div style="max-width: 650px; margin: 0 auto;">
            <a href="instructor-dashboard.html" style="display: inline-flex; align-items: center; gap: 0.4rem; color: var(--gray-600); font-weight: 600; font-size: 0.9rem; margin-bottom: 1.5rem;">
                &larr; Back to Instructor Dashboard
            </a>

            <div class="form-card" style="margin-top: 0;">
                <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--gray-200); padding-bottom: 1rem;">
                    <span class="badge badge-primary" style="margin-bottom: 0.5rem;">Instructor Tool</span>
                    <h1 style="font-size: 1.85rem; margin-top: 0.2rem;">Create a New Course</h1>
                    <p style="color: var(--gray-500); font-size: 0.95rem;">
                        Fill in the course details below. You can organize and upload lessons right after creation.
                    </p>
                </div>

                <form id="createCourseForm">
                    <!-- Title -->
                    <div class="form-group">
                        <label class="form-label" for="courseTitle">Course Title *</label>
                        <input type="text" id="courseTitle" class="form-control" placeholder="e.g., Full Stack Node.js & React Mastery" required maxlength="150">
                    </div>

                    <!-- Category & Duration -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="courseCategory">Category</label>
                            <select id="courseCategory" class="form-control">
                                <option value="Web Development">Web Development</option>
                                <option value="Data Science">Data Science</option>
                                <option value="Database Systems">Database Systems</option>
                                <option value="Design">UI/UX Design</option>
                                <option value="Mobile Development">Mobile Development</option>
                                <option value="Cloud Computing">Cloud Computing</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="courseDuration">Duration (Hours) *</label>
                            <input type="number" id="courseDuration" class="form-control" placeholder="e.g., 40" min="1" required value="20">
                        </div>
                    </div>

                    <!-- Price & Thumbnail -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="coursePrice">Price ($ USD) *</label>
                            <input type="number" step="0.01" id="coursePrice" class="form-control" placeholder="0.00 for free" min="0" required value="49.99">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="courseThumbnail">Thumbnail Image URL</label>
                            <input type="url" id="courseThumbnail" class="form-control" placeholder="https://..." value="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800">
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label class="form-label" for="courseDescription">Course Description *</label>
                        <textarea id="courseDescription" class="form-control" placeholder="Detailed outline of what students will achieve in this course..." required rows="5"></textarea>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <a href="instructor-dashboard.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg">Publish Course & Add Lessons &rarr;</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="mainFooter"></footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireInstructor()) return;

            const form = document.getElementById('createCourseForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const title = document.getElementById('courseTitle').value.trim();
                const description = document.getElementById('courseDescription').value.trim();
                const category = document.getElementById('courseCategory').value;
                const duration = parseInt(document.getElementById('courseDuration').value);
                const price = parseFloat(document.getElementById('coursePrice').value);
                const thumbnail_url = document.getElementById('courseThumbnail').value.trim();

                if (!title || !description) {
                    showToast('Please fill all required fields.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Publishing Course...';

                const res = await apiFetch('/api/courses', {
                    method: 'POST',
                    body: { title, description, category, duration, price, thumbnail_url }
                });

                if (res.success && res.course_id) {
                    showToast('Course published! Redirecting to add lessons...', 'success');
                    setTimeout(() => {
                        window.location.href = `manage-lessons.html?courseId=${res.course_id}`;
                    }, 1000);
                } else {
                    showToast(res.message || 'Failed to create course.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Publish Course & Add Lessons →';
                }
            });
        });
    </script>
</body>
</html>
