<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Antigravity LMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.08), transparent 50%), #f8fafc;">

    <!-- Header Navbar -->
    <header class="navbar" id="mainNav"></header>

    <main class="container" style="padding: 3rem 1.5rem 5rem;">
        <div class="form-card" style="max-width: 480px;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">⚡</div>
                <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Sign In to Your Account</h1>
                <p style="color: var(--gray-500); font-size: 0.9rem;">
                    Access courses, manage materials, and track learning progress.
                </p>
            </div>

            <!-- Demo Quick Login Buttons -->
            <div style="background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem;">
                <div style="font-size: 0.8rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; margin-bottom: 0.5rem; text-align: center;">
                    ⚡ 1-Click Demo Accounts
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('safwaan@lms.com', 'password123')" style="justify-content: flex-start;">
                        👨‍🏫 Safwaan (Instructor)
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('safwaan.student@lms.com', 'password123')" style="justify-content: flex-start;">
                        🎓 Safwaan (Student)
                    </button>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@domain.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submitLoginBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
                    Sign In
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--gray-600);">
                Don't have an account yet? 
                <a href="register.html" style="font-weight: 700; color: var(--primary);">Create an account</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="mainFooter"></footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        function fillDemo(email, pass) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = pass;
            showToast(`Auto-filled: ${email}`, 'info');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('submitLoginBtn');

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const res = await apiFetch('/api/auth/login', {
                method: 'POST',
                body: { email, password }
            });

            btn.disabled = false;
            btn.textContent = 'Sign In';

            if (res.success && res.token && res.user) {
                Auth.saveAuth(res.token, res.user);
                showToast(`Welcome back, ${res.user.name}!`, 'success');

                setTimeout(() => {
                    if (res.user.role === 'instructor') {
                        window.location.href = 'instructor-dashboard.html';
                    } else {
                        window.location.href = 'student-dashboard.html';
                    }
                }, 800);
            } else {
                showToast(res.message || 'Login failed. Check your email & password.', 'error');
            }
        });
    </script>
</body>
</html>
